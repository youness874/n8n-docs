name: KasbahAI CI

on:
  pull_request:
    paths:
      - "kasbahai/**"
      - ".github/workflows/kasbahai-ci.yml"
  push:
    branches:
      - main
    paths:
      - "kasbahai/**"
      - ".github/workflows/kasbahai-ci.yml"

defaults:
  run:
    working-directory: kasbahai

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kasbahai
          POSTGRES_PASSWORD: kasbahai
          POSTGRES_DB: kasbahai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://kasbahai:kasbahai@localhost:5432/kasbahai
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kasbahai/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Run migrations
        run: pnpm db:migrate

      - name: Integration tests
        run: pnpm test:integration
